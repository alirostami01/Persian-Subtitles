name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - 'worker.js'
      - 'manifest.js'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: subsource-stremio-addon-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy subsource-stremio-addon
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Worker bundle
        run: npx --yes wrangler@4.128.0 deploy --dry-run

      - name: Configure SubSource API secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUBSOURCE_API_KEY: ${{ secrets.SUBSOURCE_API_KEY }}
        run: |
          test -n "$SUBSOURCE_API_KEY"
          printf '%s' "$SUBSOURCE_API_KEY" | npx --yes wrangler@4.128.0 secret put API_KEY

      - name: Deploy to Cloudflare Workers
        run: npx --yes wrangler@4.128.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
